name: Deploy React UI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: water-meter-reader-app/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: water-meter-reader-app/ui/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages bundle
        env:
          CI: "true"
          NODE_OPTIONS: --openssl-legacy-provider
          REACT_APP_USE_MOCK_API: "true"
        run: npm run build:pages

      - name: Add optional custom domain
        if: vars.GITHUB_PAGES_CUSTOM_DOMAIN != ''
        run: echo "${{ vars.GITHUB_PAGES_CUSTOM_DOMAIN }}" > build/CNAME

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./water-meter-reader-app/ui/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
