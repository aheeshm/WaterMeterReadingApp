name: Deploy React UI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: water-meter-reader-app/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: water-meter-reader-app/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages bundle
        env:
          CI: "true"
          REACT_APP_USE_MOCK_API: "true"
        run: npm run build:pages

      - name: Add optional custom domain
        if: vars.GITHUB_PAGES_CUSTOM_DOMAIN != ''
        run: echo "${{ vars.GITHUB_PAGES_CUSTOM_DOMAIN }}" > build/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./water-meter-reader-app/ui/build
          publish_branch: gh-pages
